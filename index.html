<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temporary Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 24px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 20px;
    }

    h2 {
      margin-top: 0;
    }

    #status {
      color: #555;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .room-box {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
    }

    #room-name {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d6d9df;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.95;
    }

    #chat {
      min-height: 260px;
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid #e4e7eb;
      border-radius: 10px;
      background: #fafcff;
      padding: 12px;
      margin-bottom: 14px;
    }

    .msg {
      background: #eef4ff;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 4px 0;
      word-wrap: break-word;
      max-width: 80%;
    }

    .system {
      color: #666;
      font-size: 12px;
      text-align: center;
      margin: 8px 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 11px 12px;
      border: 1px solid #d6d9df;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Temporary Chat</h2>
    <p id="status">Connecting to chat...</p>

    <div class="room-box">
      <input id="room-name" readonly />
      <button id="copy-link">Copy link</button>
    </div>

    <div id="chat" aria-live="polite"></div>

    <div class="input-row">
      <input id="msg" placeholder="Type message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
